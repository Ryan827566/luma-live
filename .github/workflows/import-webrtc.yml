name: Import known-good Windows WebRTC SDK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/import-webrtc.yml"

permissions:
  contents: write

jobs:
  import-webrtc:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with Git LFS
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 1

      - name: Download MSVC-compatible WebRTC 5735
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/webrtc
          curl -fL --retry 5 --retry-delay 3             -o /tmp/webrtc/webrtc.zip             https://github.com/bengreenier/webrtc/releases/download/5735/5735-win-x64.zip
          unzip -q /tmp/webrtc/webrtc.zip -d /tmp/webrtc/pkg

      - name: Install SDK into repository
        shell: bash
        run: |
          set -euo pipefail

          LIB="$(find /tmp/webrtc/pkg -type f -iname 'webrtc.lib' | head -n 1)"
          HEADER="$(find /tmp/webrtc/pkg -type f -path '*/api/peer_connection_interface.h' | head -n 1)"
          if [[ -z "$LIB" || -z "$HEADER" ]]; then
            echo "WebRTC package is missing the required library or headers"
            exit 1
          fi

          INCLUDE_ROOT="$(dirname "$(dirname "$(dirname "$HEADER")")")"

          rm -rf third_party/webrtc/include
          mkdir -p third_party/webrtc/include third_party/webrtc/release
          cp -a "$INCLUDE_ROOT"/. third_party/webrtc/include/
          cp "$LIB" third_party/webrtc/release/webrtc.lib

          # Vendor the matching public Abseil headers. This removes the
          # configure-time FetchContent/network dependency from CMake.
          curl -fL --retry 5 --retry-delay 3             -o /tmp/webrtc/abseil.tar.gz             https://github.com/abseil/abseil-cpp/archive/refs/tags/20230802.1.tar.gz
          rm -rf /tmp/webrtc/abseil-src
          mkdir -p /tmp/webrtc/abseil-src
          tar -xzf /tmp/webrtc/abseil.tar.gz -C /tmp/webrtc/abseil-src --strip-components=1
          rm -rf third_party/webrtc/include/absl
          mkdir -p third_party/webrtc/include/absl
          cp -a /tmp/webrtc/abseil-src/absl/. third_party/webrtc/include/absl/

          test -f third_party/webrtc/include/api/peer_connection_interface.h
          test -f third_party/webrtc/include/absl/strings/string_view.h
          test -f third_party/webrtc/release/webrtc.lib

          echo "WebRTC SDK imported:"
          ls -lh third_party/webrtc/release/webrtc.lib

      - name: Verify repository SDK metadata
        shell: bash
        run: |
          set -euo pipefail
          test -f third_party/webrtc/include/api/peer_connection_interface.h
          test -f third_party/webrtc/include/absl/strings/string_view.h
          test -f third_party/webrtc/release/webrtc.lib
          echo "SDK layout verification: PASS"

      - name: Commit WebRTC SDK through Git LFS
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git lfs install
          git add third_party/webrtc/include third_party/webrtc/release
          if git diff --cached --quiet; then
            echo "No WebRTC SDK changes to commit."
            exit 0
          fi
          git commit -m "chore: vendor MSVC-compatible WebRTC SDK 5735"
          git lfs push origin HEAD
          git push origin HEAD
