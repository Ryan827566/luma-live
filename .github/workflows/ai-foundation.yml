name: LumaLive AI Foundation
on:
  push:
    branches: [main, master, codex/ai-platform-foundation]
    paths:
      - 'LumaLive/ai/**'
      - 'LumaLive/CMakeLists.txt'
      - '.github/workflows/ai-foundation.yml'
  pull_request:
    paths:
      - 'LumaLive/ai/**'
      - 'LumaLive/CMakeLists.txt'
      - '.github/workflows/ai-foundation.yml'
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S LumaLive/ai/ci -B build/ai -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build/ai --parallel
      - name: Test
        run: ctest --test-dir build/ai --output-on-failure
